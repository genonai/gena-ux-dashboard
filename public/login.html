<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GENA UX KPI 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#13232A; --ink-2:#4A5C64; --line:#D3DCDB;
  --primary:#0C5A61; --primary-hover:#08464C; --on-primary:#FFFFFF; --loss:#BF3F38; --focus:#0C5A61;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1618; --surface:#162124; --ink:#E3ECEC; --ink-2:#A4B4B7; --line:#2A3A3E;
    --primary:#5CC2C4; --primary-hover:#7DD3D5; --on-primary:#062124; --loss:#F07E73; --focus:#5CC2C4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1618; --surface:#162124; --ink:#E3ECEC; --ink-2:#A4B4B7; --line:#2A3A3E;
  --primary:#5CC2C4; --primary-hover:#7DD3D5; --on-primary:#062124; --loss:#F07E73; --focus:#5CC2C4;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);}
body{color:var(--ink);font:15px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  display:grid;place-items:center;padding:24px 16px;word-break:keep-all;-webkit-font-smoothing:antialiased;}
main{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;}
h1{margin:0;font-size:19px;}
p{margin:4px 0 20px;color:var(--ink-2);font-size:13.5px;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--primary);color:var(--on-primary);cursor:pointer;}
button:hover{background:var(--primary-hover);}
button:disabled{opacity:.6;cursor:default;}
.err{min-height:20px;margin:10px 0 0;color:var(--loss);font-size:13px;}
</style>
</head>
<body>
<main>
  <h1>GENA UX KPI 대시보드</h1>
  <p>공유받은 비밀번호를 입력하세요. 한 번 들어오면 30일 동안 다시 묻지 않습니다.</p>
  <form id="f">
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">들어가기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err'), pw = document.getElementById('pw');
  go.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'amp' }, body: JSON.stringify({ password: pw.value }) });
    if (res.ok) { location.replace('/'); return; }
    err.textContent = res.status === 429 ? '시도가 너무 많습니다. 잠시 후 다시 해 주세요.' : '비밀번호가 맞지 않습니다.';
    pw.select();
  } catch (x) { err.textContent = '서버에 연결하지 못했습니다.'; }
  go.disabled = false;
});
</script>
</body>
</html>
